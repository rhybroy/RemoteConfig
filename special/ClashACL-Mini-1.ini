[custom]
;不要随意改变关键字，否则会导致出错
;ruleset=DIRECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list
;ruleset=REJECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list
;ruleset=REJECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanProgramAD.list
;ruleset=OPENAI,https://cdn.jsdelivr.net/gh/dler-io/Rules@master/Clash/Provider/AI%20Suite.yaml
;ruleset=PROXY,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Telegram.list
;ruleset=PROXY,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ProxyMedia.list
;ruleset=PROXY,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ProxyLite.list
ruleset=DIRECT,[]GEOIP,CN
ruleset=XFINAL,[]FINAL

;自动组：按地区匹配，排除名称含“高倍”的节点
custom_proxy_group=香港-自动`url-test`^(?!.*高倍).*香港`https://www.gstatic.com/generate_204`600,3,200
custom_proxy_group=日本-自动`url-test`^(?!.*高倍).*日本`https://www.gstatic.com/generate_204`600,3,200
custom_proxy_group=新加坡-自动`url-test`^(?!.*高倍).*新加坡`https://www.gstatic.com/generate_204`600,3,200
custom_proxy_group=韩国-自动`url-test`^(?!.*高倍).*韩国`https://www.gstatic.com/generate_204`600,3,200
custom_proxy_group=台湾-自动`url-test`^(?!.*高倍).*台湾`https://www.gstatic.com/generate_204`600,3,200

;多地区自动组
custom_proxy_group=HKSG自动`url-test`^(?!.*高倍).*(香港|新加坡|日本|台湾|韩国)`https://www.gstatic.com/generate_204`600,3,200
custom_proxy_group=SGJP自动`url-test`^(?!.*高倍).*(新加坡|日本|台湾|韩国)`https://www.gstatic.com/generate_204`600,3,200
custom_proxy_group=JPUS自动`url-test`^(?!.*高倍).*(日本|美国)`https://www.gstatic.com/generate_204`600,3,200

;手动地区组：不排除高倍节点
custom_proxy_group=HK`select`香港
custom_proxy_group=SG`select`(新加坡|台湾|韩国)
custom_proxy_group=JP`select`日本
custom_proxy_group=US`select`美国

;全部节点手动选择
custom_proxy_group=手动选择`select`[]DIRECT`.*

;策略组
custom_proxy_group=PROXY`select`[]香港-自动`[]日本-自动`[]新加坡-自动`[]韩国-自动`[]台湾-自动`[]HKSG自动`[]SGJP自动`[]JPUS自动`[]HK`[]SG`[]JP`[]US`[]手动选择
custom_proxy_group=SpecProxy`select`[]US`[]JP`[]HK`[]SG`[]手动选择
custom_proxy_group=OPENAI`select`[]SGJP自动`[]JPUS自动`[]香港-自动`[]日本-自动`[]新加坡-自动`[]韩国-自动`[]台湾-自动`[]HK`[]SG`[]JP`[]US`[]手动选择
custom_proxy_group=XFINAL`select`[]DIRECT`[]手动选择`[]PROXY

enable_rule_generator=true
overwrite_original_rules=true
